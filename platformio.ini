
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    sparck75/AlteriomPainlessMesh@2.1.1
     olikraus/U8g2

build_unflags =
    -fno-lto

build_flags =
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections